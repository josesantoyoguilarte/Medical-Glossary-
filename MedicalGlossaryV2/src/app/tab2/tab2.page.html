<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Diagrams</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <p class="hint">
    Tap a region of the diagram to hear the Cree pronunciation.
  </p>

  <div class="diagram-wrap">
    <img [src]="imageUrl" alt="Body diagram" class="diagram-img" />
    <button
      *ngFor="let r of regions; trackBy: trackByLabel"
      type="button"
      class="region"
      [attr.aria-label]="r.label + ' — play pronunciation'"
      [style.left.%]="r.x"
      [style.top.%]="r.y"
      [style.width.%]="r.w"
      [style.height.%]="r.h"
      (click)="play(r)">
      <span class="region-label">{{ r.label }}</span>
    </button>
  </div>
</ion-content>
