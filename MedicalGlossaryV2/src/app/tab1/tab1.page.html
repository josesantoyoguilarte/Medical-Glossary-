<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Glossary</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="toggleFavoritesFilter()"
        [color]="favoritesOnly() ? 'warning' : ''"
        [attr.aria-label]="favoritesOnly() ? 'Show all terms' : 'Show favorites only'">
        <ion-icon
          slot="icon-only"
          [name]="favoritesOnly() ? 'star' : 'star-outline'">
        </ion-icon>
      </ion-button>
      <ion-select
        aria-label="Language"
        interface="popover"
        [value]="locale()"
        (ionChange)="setLocale($event.detail.value)">
        <ion-select-option value="eng">EN</ion-select-option>
        <ion-select-option value="fra">FR</ion-select-option>
        <ion-select-option value="crj">Cree (S)</ion-select-option>
        <ion-select-option value="crl">Cree (N)</ion-select-option>
      </ion-select>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      debounce="0"
      placeholder="Search terms or definitions"
      (ionInput)="onSearchChange($any($event.target).value)">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list lines="full">
    <ng-container *ngIf="!loading; else loadingTpl">
      <ion-item *ngIf="visibleResults().length === 0">
        <ion-label color="medium">
          {{ favoritesOnly() ? 'No favorites yet — tap the star on a term to add it.' : 'No matching terms.' }}
        </ion-label>
      </ion-item>

      <ng-container *ngFor="let t of visibleResults(); trackBy: trackByUuid">
        <ion-item button (click)="toggle(t.uuid)">
          <ion-button
            fill="clear"
            slot="start"
            (click)="toggleFavorite($event, t.uuid)"
            [attr.aria-label]="isFavorite(t.uuid) ? 'Remove from favorites' : 'Add to favorites'">
            <ion-icon
              slot="icon-only"
              [name]="isFavorite(t.uuid) ? 'star' : 'star-outline'"
              [color]="isFavorite(t.uuid) ? 'warning' : 'medium'">
            </ion-icon>
          </ion-button>
          <ion-label>
            <h2>{{ t.term }}</h2>
            <p *ngIf="t.definition" [innerHTML]="t.definition"></p>
          </ion-label>
          <ion-icon
            slot="end"
            [name]="expanded()[t.uuid] ? 'chevron-up-outline' : 'chevron-down-outline'">
          </ion-icon>
        </ion-item>

        <div class="entry-details" *ngIf="expanded()[t.uuid]">
          <ng-container *ngIf="entries()[t.uuid] as entry; else loadingEntry">
            <ion-item lines="none" *ngFor="let tr of entry.TermTranslation">
              <ion-label class="ion-text-wrap">
                <h3>
                  <ion-badge color="medium">{{ tr.Language || tr.locale }}</ion-badge>
                  {{ tr.term }}
                </h3>
                <p *ngIf="tr.term_syllabics">{{ tr.term_syllabics }}</p>
                <p *ngIf="tr.definition" [innerHTML]="tr.definition"></p>
              </ion-label>
            </ion-item>
          </ng-container>
          <ng-template #loadingEntry>
            <ion-item lines="none">
              <ion-spinner name="dots"></ion-spinner>
            </ion-item>
          </ng-template>
        </div>
      </ng-container>
    </ng-container>

    <ng-template #loadingTpl>
      <ion-item lines="none">
        <ion-spinner name="dots"></ion-spinner>
        <ion-label class="ion-margin-start">Loading glossary…</ion-label>
      </ion-item>
    </ng-template>
  </ion-list>
</ion-content>
