<ion-view view-title="Preference">

  <ion-content class="padding">
	
	
		<ion-radio ng-model="locale" ng-value="'eng'" ng-click="setLocale('eng')" >
			<a class="item item-icon-left">
				<i class="icon ion-ios-gear"></i>
				English
			</a>
		</ion-radio>
		<ion-radio ng-model="locale" ng-value="'fra'"  ng-click="setLocale('fra')">
			<a class="item item-icon-left">
				<i class="icon ion-ios-gear"></i>
				Français
			</a>
		</ion-radio >
 </ion-content>
</ion-view>
