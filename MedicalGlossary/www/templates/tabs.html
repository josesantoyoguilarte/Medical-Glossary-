<!--
Create tabs with an icon and label, using the tabs-positive style.
Each tab's child <ion-nav-view> directive will have its own
navigation history that also transitions its views in and out.
-->
<ion-tabs class="tabs-icon-top tabs-color-active-positive">

  <!-- Glossary Tab -->
  <ion-tab title="Glossary" icon-off="ion-ios-paper-outline" icon-on="ion-ios-paper" href="#/tab/dash">
    <ion-nav-view name="tab-glossary"></ion-nav-view>
  </ion-tab>
  <!-- Diagrams Tab -->
  <ion-tab title="Diagrams" icon-off="ion-images" icon-on="ion-images" href="#/tab/diagrams">
    <ion-nav-view name="tab-diagrams"></ion-nav-view>
  </ion-tab>

  <!-- Bookmarks Tab -->
  <ion-tab title="Bookmarks" icon-off="ion-ios-bookmarks-outline" icon-on="ion-ios-bookmarks" href="#/tab/chats">
    <ion-nav-view name="tab-chats"></ion-nav-view>
  </ion-tab>

  <!-- More Tab -->
  <ion-tab title="More" icon-off="ion-ios-more-outline" icon-on="ion-ios-more" href="#/tab/more">
    <ion-nav-view name="tab-more"></ion-nav-view>
  </ion-tab>

 


</ion-tabs>
